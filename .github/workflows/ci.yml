name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --experimental-vm-modules --test tests/frontend.test.mjs
      - run: ruff check .
      - run: python -m compileall -q mock_gps start_local.py
        env:
          API_SECRET_KEY: test-dashboard-secret
          API_ACCESS_KEY: test-api-access-secret
          FLASK_SESSION_SECRET: test-session-secret
      - run: python -m pytest
        env:
          API_SECRET_KEY: test-dashboard-secret
          API_ACCESS_KEY: test-api-access-secret
          FLASK_SESSION_SECRET: test-session-secret
